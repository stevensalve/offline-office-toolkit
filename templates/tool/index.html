<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>{{title}} (offline)</title>
    <meta name="description" content="{{tagline}} Runs in your browser; nothing is uploaded." />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container">
      <header class="site">
        <div>
          <h1>{{title}}</h1>
          <p>{{tagline}}</p>
        </div>
        <span class="badge">Works offline - nothing is uploaded</span>
      </header>

      <section class="card stack" aria-labelledby="h-main">
        <h2 id="h-main">Try it</h2>
        <div>
          <label for="name">Your name</label>
          <input type="text" id="name" autocomplete="off" />
        </div>
        <p class="status" id="status" role="status"></p>
      </section>

      <footer class="site"><a href="../../index.html">All tools</a> - MIT licensed</footer>
    </main>

    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
