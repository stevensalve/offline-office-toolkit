<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>PDF Toolkit - merge, split, rotate, extract (offline)</title>
    <meta
      name="description"
      content="Merge, split, rotate, extract and delete PDF pages. Runs in your browser; files never leave your computer."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container">
      <header class="site">
        <div>
          <h1>PDF Toolkit</h1>
          <p>Merge, split, rotate, extract and delete pages.</p>
        </div>
        <span class="badge">Works offline - files never leave this device</span>
      </header>

      <div class="tabs" role="tablist" id="tabs" aria-label="PDF tools">
        <button role="tab" id="tab-merge" aria-controls="panel-merge" aria-selected="true">Merge</button>
        <button role="tab" id="tab-extract" aria-controls="panel-extract">Extract / re-order</button>
        <button role="tab" id="tab-delete" aria-controls="panel-delete">Delete pages</button>
        <button role="tab" id="tab-rotate" aria-controls="panel-rotate">Rotate</button>
        <button role="tab" id="tab-split" aria-controls="panel-split">Split</button>
      </div>

      <section id="panel-merge" role="tabpanel" aria-labelledby="tab-merge" class="card">
        <h2>Merge PDFs</h2>
        <p class="hint">Add two or more PDFs, put them in the order you want, then merge.</p>
        <label class="dropzone" id="merge-drop">
          Drop PDF files here or click to choose
          <input type="file" id="merge-input" accept="application/pdf,.pdf" multiple />
        </label>
        <ul class="files" id="merge-list" aria-label="Files to merge"></ul>
        <div class="row">
          <button class="primary" id="merge-run" disabled>Merge and download</button>
          <button id="merge-clear" disabled>Clear list</button>
        </div>
        <p class="status" id="merge-status" role="status"></p>
      </section>

      <template id="single-tpl">
        <h2></h2>
        <p class="hint help"></p>
        <label class="dropzone">
          Drop a PDF here or click to choose
          <input type="file" accept="application/pdf,.pdf" />
        </label>
        <p class="fileinfo" aria-live="polite"></p>
        <div class="fields stack"></div>
        <div class="row">
          <button class="primary run" disabled></button>
        </div>
        <p class="status" role="status"></p>
      </template>

      <section id="panel-extract" role="tabpanel" aria-labelledby="tab-extract" class="card" hidden></section>
      <section id="panel-delete" role="tabpanel" aria-labelledby="tab-delete" class="card" hidden></section>
      <section id="panel-rotate" role="tabpanel" aria-labelledby="tab-rotate" class="card" hidden></section>
      <section id="panel-split" role="tabpanel" aria-labelledby="tab-split" class="card" hidden></section>

      <footer class="site">
        <a href="../../index.html">All tools</a> - MIT licensed - powered by <a href="vendor/README.md">pdf-lib</a>
      </footer>
    </main>

    <script src="vendor/pdf-lib.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
