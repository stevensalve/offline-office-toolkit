<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Image Tools - compress, resize, convert, image to PDF (offline)</title>
    <meta
      name="description"
      content="Compress, resize, crop and convert images, or turn them into a PDF. Runs in your browser; images never leave your computer."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container">
      <header class="site">
        <div>
          <h1>Image Tools</h1>
          <p>Compress, resize, crop, convert - or combine into a PDF.</p>
        </div>
        <span class="badge">Works offline - images never leave this device</span>
      </header>

      <section class="card" aria-labelledby="h-add">
        <h2 id="h-add">1. Add images</h2>
        <label class="dropzone" id="drop">
          Drop JPG, PNG or WebP images here, or click to choose
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" multiple />
        </label>
        <ul class="files" id="source-list" aria-label="Selected images"></ul>
        <button id="clear" disabled>Clear all</button>
      </section>

      <section class="card" aria-labelledby="h-opt">
        <h2 id="h-opt">2. Choose what to do</h2>
        <div class="grid">
          <div>
            <label for="resize-mode">Size</label>
            <select id="resize-mode">
              <option value="none">Keep original size</option>
              <option value="max" selected>Shrink to fit within...</option>
              <option value="percent">Scale by percent</option>
            </select>
          </div>
          <div id="max-fields">
            <label for="max-width">Max width (px)</label>
            <input type="number" id="max-width" min="1" value="1600" />
            <label for="max-height">Max height (px)</label>
            <input type="number" id="max-height" min="1" value="1600" />
          </div>
          <div id="percent-field" hidden>
            <label for="percent">Percent</label>
            <input type="number" id="percent" min="1" max="500" value="50" />
          </div>
          <div>
            <label for="crop">Crop (centred)</label>
            <select id="crop">
              <option value="">No crop</option>
              <option value="1:1">Square 1:1</option>
              <option value="4:3">4:3</option>
              <option value="3:2">3:2</option>
              <option value="16:9">16:9</option>
              <option value="3:4">3:4 portrait</option>
              <option value="9:16">9:16 portrait</option>
            </select>
          </div>
          <div>
            <label for="format">Format</label>
            <select id="format">
              <option value="original">Same as original</option>
              <option value="jpeg" selected>JPEG (smallest for photos)</option>
              <option value="png">PNG (lossless)</option>
              <option value="webp">WebP (small, modern)</option>
            </select>
          </div>
          <div>
            <label for="quality">Quality: <output id="quality-out">80</output>%</label>
            <input type="range" id="quality" min="10" max="100" value="80" />
            <p class="hint">Applies to JPEG and WebP.</p>
          </div>
        </div>
        <div class="row">
          <button class="primary" id="process" disabled>Process images</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="card" aria-labelledby="h-res" id="results-card" hidden>
        <h2 id="h-res">3. Results</h2>
        <ul class="files" id="result-list" aria-label="Processed images"></ul>
        <div class="row">
          <button id="download-all">Download all</button>
        </div>
        <h3>Make a PDF from the results</h3>
        <div class="row">
          <div>
            <label for="pdf-size">Page size</label>
            <select id="pdf-size">
              <option value="a4">A4</option>
              <option value="letter">US Letter</option>
              <option value="fit">Same as image</option>
            </select>
          </div>
          <div>
            <label for="pdf-margin">Margin</label>
            <select id="pdf-margin">
              <option value="0">None</option>
              <option value="24" selected>Small</option>
              <option value="48">Medium</option>
            </select>
          </div>
          <button class="primary" id="make-pdf">Create PDF</button>
        </div>
        <p class="status" id="pdf-status" role="status"></p>
      </section>

      <footer class="site">
        <a href="../../index.html">All tools</a> - MIT licensed - PDF export by <a href="vendor/README.md">pdf-lib</a>
      </footer>
    </main>

    <script src="vendor/pdf-lib.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
